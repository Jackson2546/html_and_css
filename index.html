<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container{
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 50px;
        
    }

    .card{
        background-color: #fff;
        width: 220px;
        border-radius: 10;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        text-align: center;
        padding-bottom: 15px;

    }

    .card img{
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .card h4{
        margin: 10px 0 5px;
    }
    .card p{
        color: grey;
        margin-bottom: 15px;
    }
    .card button{
        background: rgba(7, 109, 217, 0.724);
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
    }
    .card button:hover{
        background: rgb(7, 151, 187);
    }

    .card p img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }
</style>
<body>
    <div class="container">

        <div class="card">
            <img src="paka 1.jpg" alt="paka">
            <h4>Oliver</h4>
            <p>
                <img src="paka 1.jpg" class="circle-imag">
                2 matual friends
            </p>
            <button>Add Friends</button>
        </div>

        <div class="card">
            <img src="paka 2.jpg" alt="paka">
            <h4>Mini</h4>
            <p>
                <img src="paka 2.jpg" class="circle-imag">
                3 matual friends
            </p>
            <button>Add Friends</button>
        </div>

        <div class="card">
            <img src="paka 3.jpg" alt="paka">
            <h4>Rex</h4>
            <p>
                <img src="paka 3.jpg" class="circle-imag">
                4 matual friends
            </p>
            <button>Add Friends</button>
        </div>


    </div>
</body>
</html>
