<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 2</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        background-color: rgb(43, 40, 40);
        font-family: sans-serif;
        font-size: 13px;
    }
    .container1 {
        display: flex;
        flex-direction: row;
        border: 1px solid rgb(241, 238, 238);
        width: 75%;
        height: 400px;
        margin:auto;
        align-items:center;
        gap: 20px;
    }

    .box1 {
        background-color: #fff;
        border: 1px solid black;
        width: 100%;
        height: 150px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 20px;
    }

    .number {
        background-color: rgb(9, 145, 249);
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 10px;
        color: #fff;
    }

    /*box 2*/
    .box2{
        background-color: #fff;
        border: 1px solid black;
        width: 100%;
        margin-bottom: 20px;
    }

    .profile{
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }
    .profile img{
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
    }

    .info{
        flex: 1;
        margin-left: 20px;
    }

    .info h3, .info p{
        margin: 5px; 
    }

    .info p{
        color: grey;
    }

    .profile button{
        background: #0c86e3;
        padding: 10px 20px;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    /*container 2*/
     .down{
            display: flex;
            flex-direction: row;
            border: 1px solid black;
            margin-top: 30px;
            margin-left: 100px;
            margin-right: 100px;
            background-color: blueviolet;
            justify-content: space-between;
            align-items: center;
        }

        .down p{
            color: white;
            margin-left: 10px;
            font-size: 15px;
        }

        .down input{
            border: none;
            padding: 5px;
            padding-left: 50px;
            padding-right: 50px;
            border-radius: 20px;
            
        } 

        .down button{
            color: white;
            background-color: blueviolet;
            border: 1.5px solid rgb(236, 213, 213);
            padding: 5px;
            border-radius: 6px;
            margin-right: 10px;
        }

        .content2 img{
            object-fit: cover;
            width: 40px;
            height: 30px;
        }
</style>

<body>
    <div class="container1">
        <div class="box1">
            <div class="row">
                <span>Home</span>
                <span class="number">14</span>
            </div>

            <div class="row">
                <span>Notification</span>
                <span class="number">3</span>
            </div>

            <div class="row">
                <span>Messages</span>
                <span class="number">5</span>
            </div>
        </div>

        <div class="box2">
            <div class="profile">
                <img src="../Jackson.jpeg" alt="picha">

                <div class="info">
                    <h3>Jackson</h3>
                    <p>Code for</p>
                    <p>Life</p>
                </div>
                <button>Follow</button>
            </div>
            <div class="profile">
                <img src="../Jackson.jpeg" alt="picha">

                <div class="info">
                    <h3>Jackson</h3>
                    <p>Code for</p>
                    <p>Life</p>
                </div>
                <button>Follow</button>
            </div>
            <div class="profile">
                <img src="../Jackson.jpeg" alt="picha">

                <div class="info">
                    <h3>Jackson</h3>
                    <p>Code</p>
                    <p>Life</p>
                </div>
                <button>Follow</button>
            </div>
        </div>
    </div>

     <div class="container2">
        <div class="down">
                <p>Home</p>
                <input type="search" placeholder="search">
                <button class="simple">Download</button>
        </div>
     </div>

</body>

</html>
